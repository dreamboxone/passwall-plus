# Part of Passwall+ - https://github.com/dreamboxone/passwall-plus
#
# Check everything, build installable packages in both formats, and publish
# them.
#
# Tests run on every push and every pull request. Packages are built for a
# version tag, or by hand:
#
#     git tag v1.0.0 && git push origin v1.0.0

name: Build and release packages

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENWRT_RELEASE: '25.12.5'
  SDK_TARGET: 'ipq40xx/generic'      # only the host apk tool is taken from it

jobs:
  # Everything that can be checked without building a package. It runs first
  # and the build waits on it, because a package that ships a script with a
  # syntax error in it is worse than no package at all.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install nftables
        run: sudo apt-get update -qq && sudo apt-get install -y nftables

      - name: Fetch a core to check against
        run: |
          set -euo pipefail
          sh ./build/build-core.sh x86_64
          ./prebuilt/x86_64/xray version

      - name: Fetch the routing data the split needs
        run: |
          set -euo pipefail
          # The lite pair, because the tests only need the categories to exist
          # and the full pair is twenty-five megabytes.
          mkdir -p geo
          base=https://raw.githubusercontent.com/Chocolate4U/Iran-v2ray-rules/release
          curl -fsSL --retry 3 -o geo/geoip.dat   "$base/geoip-lite.dat"
          curl -fsSL --retry 3 -o geo/geosite.dat "$base/geosite-lite.dat"
          ls -l geo/

      - name: Run the test suites
        run: |
          set -euo pipefail
          # nft --check needs to talk to the kernel about which modules exist,
          # and the transparent-proxy probe genuinely loads a throwaway table.
          sudo -E env \
            RIG_XRAY="$PWD/prebuilt/x86_64/xray" \
            PWPLUS_GEO_DIR="$PWD/geo" \
            PATH="$PATH" \
            sh test/run.sh

      # Separate from the suites above because it depends on somebody else's
      # server list being up this morning, which is not a reason to fail a
      # build. It is here because it is the only check that reads what the
      # world is actually publishing today rather than a fixture written
      # months ago - a subscription that changes shape shows up here first.
      - name: Read the live list (informational)
        continue-on-error: true
        run: |
          set -euo pipefail
          sub=$(sed -n "s/.*option url '\(https[^']*\)'.*/\1/p" \
                package/passwall-plus/files/passwall-plus.config | head -1)
          echo "source: $sub"
          curl -fsSL --retry 3 -o live.txt "$sub"
          echo "lines: $(grep -c . live.txt)"
          LC_ALL=C awk -f package/passwall-plus/files/pwplus-parse < live.txt > live.tsv
          echo "parsed: $(wc -l < live.tsv) servers"
          test "$(wc -l < live.tsv)" -gt 0
          cut -f3 live.tsv | sort | uniq -c | sort -rn

          # Every single one, in front of the binary that would have to run it.
          rej=0
          while IFS=$'\t' read -r tag label proto host port payload; do
            case "$proto" in hysteria2|tuic) continue ;; esac
            printf '{"log":{"loglevel":"none"},"outbounds":[%s]}' \
              "$(printf '%s' "$payload" | sed 's/^{/{"tag":"proxy",/')" > one.json
            if ! ./prebuilt/x86_64/xray run -test -config one.json >one.err 2>&1; then
              rej=$((rej+1))
              echo "::warning::today's list has a server the core will not accept: $proto $host:$port"
              grep -o 'common/errors:.*' one.err | tail -1 | cut -c1-160 || true
            fi
          done < live.tsv
          echo "rejected by the core: $rej of $(wc -l < live.tsv)"

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: armv7      # ipq40xx, mvebu, most ARM routers
            openwrt_arch: arm_cortex-a7_neon-vfpv4
          - name: aarch64    # filogic, rockchip, newer ARM64 routers
            openwrt_arch: aarch64_cortex-a53
          - name: mipsel     # ramips / mt7621
            openwrt_arch: mipsel_24kc
          - name: x86_64     # x86 builds and VMs
            openwrt_arch: x86_64

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Fetch the Xray core for ${{ matrix.name }}
        run: |
          set -euo pipefail
          sh ./build/build-core.sh ${{ matrix.name }}
          ls -l prebuilt/${{ matrix.openwrt_arch }}/xray
          file prebuilt/${{ matrix.openwrt_arch }}/xray

      - name: Start it for real
        if: matrix.name == 'x86_64'
        run: |
          set -euo pipefail
          # Accepting a configuration and being able to serve it are different
          # things, and the difference is where this went wrong on a real
          # router: the core read the file, said nothing, stayed alive and
          # never listened. So start it and look for the socket.
          cat > best.json <<'EOF'
          {"protocol":"freedom"}
          EOF
          PWPLUS_LIB="$PWD/package/passwall-plus/files" PWPLUS_ETC="$PWD" PWPLUS_RUN="$PWD" \
            sh package/passwall-plus/files/pwplus-mkconfig > cfg.json
          ./prebuilt/x86_64/xray run -test -config cfg.json
          sudo ./prebuilt/x86_64/xray run -config cfg.json > xray.log 2>&1 &
          xpid=$!
          for i in $(seq 1 15); do
            if ss -lntu 2>/dev/null | grep -qE '[:.](1082|1053|10853)[[:space:]]'; then break; fi
            sleep 1
          done
          ss -lntu 2>/dev/null | grep -E '[:.](1082|1053|10853)[[:space:]]' || {
            echo "::error::the core started but never listened"
            echo "--- it said:"; cat xray.log
            sudo kill $xpid 2>/dev/null || true
            exit 1
          }
          echo "== listening on the transparent proxy, DNS and stats ports"

          # And the stats interface has to answer, because the traffic page
          # reads it and a silent failure there shows zero for ever.
          ./prebuilt/x86_64/xray api statsquery --server=127.0.0.1:10853 \
            | grep -q 'outbound>>>proxy>>>traffic' \
            || { echo "::error::the stats interface did not answer"; exit 1; }
          echo "== the stats interface answers"
          sudo kill $xpid 2>/dev/null || true

      - name: Fetch the apk tool from an OpenWrt SDK
        run: |
          set -euo pipefail
          base="https://downloads.openwrt.org/releases/${OPENWRT_RELEASE}/targets/${SDK_TARGET}"
          name=$(curl -fsSL "$base/" \
                 | grep -o 'openwrt-sdk-[^"]*\.Linux-x86_64\.tar\.\(xz\|zst\)' \
                 | head -1)
          [ -n "$name" ] || { echo "::error::no SDK found under $base"; exit 1; }
          echo "SDK: $name"

          curl -fsSL --retry 3 -o sdk.tar "$base/$name"
          mkdir -p sdk
          case "$name" in
            *.zst) sudo apt-get update -qq && sudo apt-get install -y zstd
                   tar --use-compress-program=unzstd -xf sdk.tar -C sdk --strip-components=1 ;;
            *.xz)  tar -xJf sdk.tar -C sdk --strip-components=1 ;;
          esac

          echo "APK_BIN=$PWD/sdk/staging_dir/host/bin/apk" >> "$GITHUB_ENV"
          "$PWD/sdk/staging_dir/host/bin/apk" --version

      - name: Package for ${{ matrix.openwrt_arch }}
        run: |
          set -euo pipefail
          # as root so packaged files are owned by root:root
          sudo -E sh ./build/build-apk.sh "${{ matrix.openwrt_arch }}" "$APK_BIN"
          sudo -E sh ./build/build-ipk.sh "${{ matrix.openwrt_arch }}"
          ls -l dist/

      - name: Verify the packages
        run: |
          set -euo pipefail
          for f in dist/*.apk; do
            echo "== $f"
            "$APK_BIN" adbdump "$f" | grep -E '^[[:space:]]*(name|version|arch):' || true
          done

          rm -rf verify && mkdir -p verify/apk verify/ipk
          "$APK_BIN" extract --destination verify/apk --allow-untrusted --no-chown dist/passwall-plus-*.apk

          tar -xzf dist/passwall-plus_*_${{ matrix.openwrt_arch }}.ipk -C verify/ipk
          mkdir -p verify/ipk/data verify/ipk/control
          tar -xzf verify/ipk/data.tar.gz -C verify/ipk/data
          tar -xzf verify/ipk/control.tar.gz -C verify/ipk/control
          grep -qx "Architecture: ${{ matrix.openwrt_arch }}" verify/ipk/control/control

          # Everything that has to be runnable, in both formats. A helper
          # shipped without its executable bit is a package that installs
          # perfectly and then does nothing at all.
          for base in verify/apk verify/ipk/data; do
            test -x "$base/usr/libexec/passwall-plus/xray"
            test -x "$base/etc/init.d/passwall-plus"
            test -x "$base/usr/libexec/rpcd/luci.passwall-plus"
            for s in $(sed -n 's/^PWPLUS_SCRIPTS="//p' build/packages.inc.sh | tr -d '"'); do
              test -x "$base/usr/libexec/$s" || {
                echo "::error::$base/usr/libexec/$s is not executable"; exit 1; }
            done
            test -s "$base/etc/passwall-plus/version"
          done
          echo "== every shipped helper is executable in both formats"
          file verify/apk/usr/libexec/passwall-plus/xray

          # The version the web interface shows has to be the version that
          # was built, not one somebody forgot to bump.
          want=$(sed -n 's/^VERSION=//p' build/packages.inc.sh)-r$(sed -n 's/^RELEASE=//p' build/packages.inc.sh)
          got=$(cat verify/apk/etc/passwall-plus/version)
          [ "$want" = "$got" ] || { echo "::error::version is $got, expected $want"; exit 1; }
          echo "== the packaged version is $got"

          # The web interface is a separate package and was once going out
          # unchecked: a menu file that never reached the router looks exactly
          # like a green build.
          rm -rf verifyl && mkdir -p verifyl/apk verifyl/ipk
          "$APK_BIN" extract --destination verifyl/apk --allow-untrusted --no-chown dist/luci-app-passwall-plus-*.apk
          tar -xzf dist/luci-app-passwall-plus_*_all.ipk -C verifyl/ipk
          mkdir -p verifyl/ipk/data && tar -xzf verifyl/ipk/data.tar.gz -C verifyl/ipk/data
          for base in verifyl/apk verifyl/ipk/data; do
            test -s "$base/usr/share/luci/menu.d/luci-app-passwall-plus.json"
            test -s "$base/usr/share/rpcd/acl.d/luci-app-passwall-plus.json"
            for v in overview nodes settings; do
              test -s "$base/www/luci-static/resources/view/passwall-plus/$v.js"
            done
          done
          # every menu entry has to name a view the package actually ships
          for view in $(grep -o '"path": *"[^"]*"' verifyl/apk/usr/share/luci/menu.d/luci-app-passwall-plus.json | cut -d'"' -f4); do
            test -s "verifyl/apk/www/luci-static/resources/view/$view.js"
            echo "== menu entry $view.js is in the package"
          done

          # both formats must ship exactly the same tree
          ( cd verify/apk && find . -type f | grep -v '^./lib/apk' | sort ) > apk.list
          ( cd verify/ipk/data && find . -type f | sort ) > ipk.list
          diff apk.list ipk.list
          echo "== both formats ship $(wc -l < ipk.list) identical paths"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: passwall-plus-${{ matrix.openwrt_arch }}
          path: |
            dist/*.apk
            dist/*.ipk

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Collect every architecture
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Lay the files out for the release
        run: |
          set -euo pipefail
          mkdir -p release
          for dir in artifacts/passwall-plus-*; do
            arch="${dir#artifacts/passwall-plus-}"
            for f in "$dir"/*.apk; do
              base=$(basename "$f" .apk)
              case "$base" in
                luci-app-*) cp -f "$f" "release/$base.apk" ;;   # noarch, one copy
                *)          cp -f "$f" "release/$base.$arch.apk" ;;
              esac
            done
            # .ipk filenames already carry the architecture
            for f in "$dir"/*.ipk; do cp -f "$f" "release/$(basename "$f")"; done
          done
          ls -l release/
          (cd release && sha256sum * > SHA256SUMS)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          cat > notes.md <<'NOTES'
          Pick the pair that matches your router. OpenWrt changed package
          manager in 25.12, so both formats are here.

          | Your OpenWrt | Files |
          |---|---|
          | 25.12 and later | `passwall-plus-<version>.<arch>.apk` and `luci-app-passwall-plus-<version>.apk` |
          | 24.10, 23.05 | `passwall-plus_<version>_<arch>.ipk` and `luci-app-passwall-plus_<version>_all.ipk` |

          Your architecture is `DISTRIB_ARCH` in `/etc/openwrt_release`.

          Then open LuCI, go to **Services -> Passwall+** and press **Connect**.

          راهنمای کامل: README.md · Full guide in English: README.en.md
          NOTES
          sed -i 's/^          //' notes.md

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
            gh release edit   "$tag" --title "Passwall+ $tag" --notes-file notes.md
          else
            gh release create "$tag" release/* \
              --title "Passwall+ $tag" \
              --notes-file notes.md
          fi
